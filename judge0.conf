################################################################################
# Judge0 CE Configuration
# ------------------------------------------------------------------------------
# Secrets and connection targets are resolved via environment variables.
# Real credentials should be defined in .env (outside Git).
################################################################################

# Redis Configuration
REDIS_HOST=${REDIS_HOST:-judge0-redis}
REDIS_PORT=${REDIS_PORT:-6379}
REDIS_PASSWORD=${REDIS_PASSWORD}

# PostgreSQL Configuration
POSTGRES_HOST=${POSTGRES_HOST:-judge0-db}
POSTGRES_PORT=${POSTGRES_PORT:-5432}
POSTGRES_DB=${POSTGRES_DB:-judge0}
POSTGRES_USER=${POSTGRES_USER:-judge0}
POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

# Access Controls
ALLOW_ORIGIN=*

# Execution Sandboxing Limits
CPU_TIME_LIMIT=5.0
MAX_CPU_TIME_LIMIT=15.0
CPU_EXTRA_TIME=1.0
MAX_CPU_EXTRA_TIME=5.0
WALL_TIME_LIMIT=10.0
MAX_WALL_TIME_LIMIT=20.0
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120
MAX_FILE_SIZE=4096
NUMBER_OF_RUNS=1

# Rails Environment
RAILS_ENV=production
RAILS_MAX_THREADS=4
RAILS_SERVER_PROCESSES=2
