networks:
  edulabs-net:
    driver: bridge

volumes:
  judge0-db-data:
  judge0-redis-data:

services:
  # ============================================================================
  # 1. Judge0 PostgreSQL Database
  # ============================================================================
  judge0-db:
    image: postgres:13.0-alpine
    container_name: edulabs-judge0-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-judge0}
      POSTGRES_USER: ${POSTGRES_USER:-judge0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - judge0-db-data:/var/lib/postgresql/data/
    networks:
      - edulabs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-judge0} -d $${POSTGRES_DB:-judge0}"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 5s

  # ============================================================================
  # 2. Judge0 Redis Cache & Queue
  # ============================================================================
  judge0-redis:
    image: redis:6.0-alpine
    container_name: edulabs-judge0-redis
    restart: always
    command: ["sh", "-c", "docker-entrypoint.sh --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - judge0-redis-data:/data
    networks:
      - edulabs-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 5s

  # ============================================================================
  # 3. Judge0 CE Server (API)
  #
  # PRIVILEGED CONTAINER AUDIT NOTE:
  # Judge0 mandates 'privileged: true' to support its underlying 'isolate' sandbox.
  # 'isolate' requires direct Linux kernel access to construct unprivileged User,
  # PID, and Mount/chroot namespaces, as well as managing cgroup limits under
  # /sys/fs/cgroup. Inside the container, untrusted user code runs under a separate
  # non-root 'isolate' sandbox account, not host root. Without privileged mode,
  # containerized isolate fails with 'clone(): Operation not permitted' or cgroup
  # initialization denial. Security is maintained by network isolation (edulabs-net)
  # and restricted inter-service container exposure.
  # ============================================================================
  judge0-server:
    image: judge0/judge0:1.13.0
    container_name: edulabs-judge0-server
    restart: always
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=${REDIS_HOST:-judge0-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-judge0-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-judge0}
      - POSTGRES_USER=${POSTGRES_USER:-judge0}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    env_file:
      - path: .env
        required: false
    networks:
      - edulabs-net
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2358/system_info || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================================
  # 4. Judge0 Workers (Queue Consumer)
  #
  # PRIVILEGED CONTAINER AUDIT NOTE:
  # Workers process submission jobs and directly execute compiler/isolate runs,
  # requiring identical 'privileged: true' kernel capabilities for cgroup and
  # namespace confinement.
  # ============================================================================
  judge0-workers:
    image: judge0/judge0:1.13.0
    container_name: edulabs-judge0-workers
    restart: always
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      - REDIS_HOST=${REDIS_HOST:-judge0-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-judge0-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-judge0}
      - POSTGRES_USER=${POSTGRES_USER:-judge0}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    env_file:
      - path: .env
        required: false
    networks:
      - edulabs-net
    depends_on:
      judge0-server:
        condition: service_healthy
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  # ============================================================================
  # 5. FastAPI Evaluation Microservice (Unprivileged)
  # ============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edulabs-fastapi-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - JUDGE0_API_URL=http://judge0-server:2358
      - JUDGE0_API_KEY=${JUDGE0_API_KEY:-}
      - JUDGE0_API_HOST=${JUDGE0_API_HOST:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - ENABLE_DEMO_LOGIN=${ENABLE_DEMO_LOGIN:-true}
      - DEMO_STUDENT_EMAIL=${DEMO_STUDENT_EMAIL:-student001@college.edu}
      - DEMO_STUDENT_PASSWORD=${DEMO_STUDENT_PASSWORD:-}
      - DEMO_FACULTY_EMAIL=${DEMO_FACULTY_EMAIL:-faculty001@college.edu}
      - DEMO_FACULTY_PASSWORD=${DEMO_FACULTY_PASSWORD:-}
    env_file:
      - path: .env
        required: false
      - path: ./server/.env
        required: false
    networks:
      - edulabs-net
    depends_on:
      judge0-server:
        condition: service_healthy
